<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // Only redirect if not already at root or if there's no ?redirect= param
      if (!location.search.includes("redirect")) {
        const redirectPath = location.pathname.replace("/Portfolio", "");
        location.replace("/Portfolio/?redirect=" + redirectPath);
      }
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
